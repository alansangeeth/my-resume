<button class="dark-mode-toggle" id="darkModeToggle" role="switch"
    aria-label="Toggle dark mode">
    <!-- Sun -->
    <svg class="icon sun-icon" viewBox="0 -4 32 32" aria-hidden="true">
        <circle cx="12" cy="12" r="4"></circle>

        <!-- Top -->
        <line x1="12" y1="2" x2="12" y2="4"></line>

        <!-- Top-right -->
        <line x1="19.1" y1="4.9" x2="17.7" y2="6.3"></line>

        <!-- Right -->
        <line x1="22" y1="12" x2="20" y2="12"></line>

        <!-- Bottom-right -->
        <line x1="19.1" y1="19.1" x2="17.7" y2="17.7"></line>

        <!-- Bottom -->
        <line x1="12" y1="22" x2="12" y2="20"></line>

        <!-- Bottom-left -->
        <line x1="4.9" y1="19.1" x2="6.3" y2="17.7"></line>

        <!-- Left -->
        <line x1="2" y1="12" x2="4" y2="12"></line>

        <!-- Top-left -->
        <line x1="4.9" y1="4.9" x2="6.3" y2="6.3"></line>
    </svg>

    <!-- Moon -->
    <svg class="icon moon-icon" viewBox="-8 -4 32 32" aria-hidden="true">
        <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3
                                 A6.7 6.7 0 0 0 21 12.8Z">
        </path>
    </svg>

    <!-- Thumb -->
    <span class="thumb"></span>
</button>
