<button class="dark-mode-toggle" id="darkModeToggle" type="button" role="switch" aria-checked="true"
    aria-label="Dark mode" title="Toggle dark mode">
    <!-- Night sky: shown in dark mode -->
    <span class="scene stars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <!-- Day sky: shown in light mode -->
    <span class="scene clouds" aria-hidden="true"><i></i><i></i></span>

    <!-- Thumb carries the sun / moon -->
    <span class="thumb" aria-hidden="true">
        <svg class="icon sun-icon" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="4.2"></circle>
            <path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"></path>
        </svg>
        <svg class="icon moon-icon" viewBox="0 0 24 24">
            <path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.8 6.8 0 0 0 10.7 10.7Z"></path>
        </svg>
    </span>
</button>
